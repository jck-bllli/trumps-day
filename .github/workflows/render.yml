name: Render on home PC

on:
  push:
    branches: [main]
    paths: ["days/*.json"]   # a new day file from the research task -> render it on the PC, then post
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: render the newest day to a temp folder and attach it to the run (commits and posts nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # lets this job start the post workflow when the video is ready

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, render-pc]   # Jack's home PC; if it is offline the 8:23am PT backup renders in the cloud
    timeout-minutes: 60
    defaults:
      run:
        # Git Bash by full path: plain "bash" resolves to the WSL stub in System32 for the runner service
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      PYTHONUTF8: "1"   # Windows defaults to cp1252; the day files have emoji and curly quotes
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false   # keep the downloaded voice model and emoji font between runs

      - name: Python environment for this repo
        # each repo gets its own venv, so the two runners never pip-install into the same folder at once
        run: |
          [ -x .venv/Scripts/python.exe ] || python -m venv .venv
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"

      - name: Find ffmpeg
        # the runner service does not always see the PATH change from the ffmpeg install, so look in winget's folder too
        run: |
          if command -v ffmpeg >/dev/null; then command -v ffmpeg; exit 0; fi
          d=$(ls -d "/c/Program Files/WinGet/Packages"/Gyan.FFmpeg*/*/bin 2>/dev/null | head -1)
          [ -n "$d" ] || { echo "::error::ffmpeg is not installed on the home PC"; exit 1; }
          echo "using $d"
          cygpath -w "$d" >> "$GITHUB_PATH"

      - name: Setup (fast after the first run)
        run: bash render/setup.sh

      - name: Test render (commits and posts nothing)
        if: inputs.test
        run: |
          day=$(ls days/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json | sort | tail -1)
          start=$(date +%s)
          python produce.py "$day" --dry-run | tee test.log
          out=$(sed -n 's/^Dry run done: //p' test.log)
          mkdir -p test-render && cp "$out" test-render/
          echo "Test render of $day took $(( $(date +%s) - start ))s on the home PC." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.test
        with:
          name: test-render
          path: test-render/

      - name: Render the newest day
        if: ${{ !inputs.test }}
        id: render
        run: python render_next.py

      - name: Save the video and queue
        if: steps.render.outputs.rendered
        run: |
          git config user.name "trumpsday-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos queue.json
          git commit -m "Render ${{ steps.render.outputs.rendered }} on home PC"
          git pull --rebase --autostash
          git push

      - name: Start the post workflow
        if: steps.render.outputs.rendered
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/post.yml/dispatches" \
            -d '{"ref":"main","inputs":{"mode":"post"}}'
          echo "Rendered ${{ steps.render.outputs.rendered }} on the home PC and started posting." >> "$GITHUB_STEP_SUMMARY"
